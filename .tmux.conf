# prefixキーをC-tに変更する
set -g prefix C-q

# C-bのキーバインドを解除する
unbind C-b

# キーストロークのディレイを減らす
set -sg escape-time 1

# ウィンドウのインデックスを1から始める
set -g base-index 1

# ペインのインデックスを1から始める
setw -g pane-base-index 1

# 設定ファイルをリロードする
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# C-a*2でtmux内のプログラムにC-aを送る
bind C-a send-prefix

# | でペインを縦に分割する
bind | split-window -h

# - でペインを横に分割する
bind - split-window -v

# Vimのキーバインドでペインを移動する
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Spaceでペイン数に応じたレイアウトに変更する
bind Space run-shell '"$(dirname "$(readlink ~/.tmux.conf || echo ~/.tmux.conf)")"/tmux-apply-layout.sh'

# Vimのキーバインドでペインをリサイズする
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# コピーモード
bind v copy-mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi H send-keys -N 10 -X cursor-left
bind-key -T copy-mode-vi J send-keys -N 10 -X cursor-down
bind-key -T copy-mode-vi K send-keys -N 10 -X cursor-up
bind-key -T copy-mode-vi L send-keys -N 10 -X cursor-right
bind-key -T copy-mode-vi Escape if-shell -F '#{selection_present}' 'send-keys -X clear-selection' 'send-keys -X cancel'
bind-key -T copy-mode-vi C-n send-keys -X page-up
bind-key -T copy-mode-vi C-f send-keys -X page-down
bind-key -T copy-mode-vi C-u send-keys -X halfpage-up
bind-key -T copy-mode-vi C-d send-keys -X halfpage-down

# マウス操作を有効にする
setw -g mouse on

# 256色端末を使用する
set -g default-terminal "tmux-256color"

# ステータスバーの色を設定する
set -g status-fg white
set -g status-bg colour234

# ウィンドウリストの色を設定する
setw -g window-status-style fg=colour253,bg=default,dim
setw -g window-status-format "     #I     "
# アクティブなウィンドウを目立たせる
setw -g window-status-current-style fg=white,bg=colour31,bright
setw -g window-status-current-format "[    #I    ]"

# ペインボーダーの色を設定する
set -g pane-border-style fg=colour243,bg=colour237
set -g pane-border-status top
set -g pane-border-format '#{?pane_in_mode,#[fg=colour226#,bg=colour237#,bold] COPY ,#[fg=colour31#,bold] [ #{pane_index} ] #[fg=colour214#,nobold]#{pane_current_command} #[fg=colour243]| #[fg=colour250]#(echo "#{pane_current_path}" | sed "s|^$HOME|~|") }'
# アクティブなペインを目立たせる
set -g pane-active-border-style fg=white,bg=colour243
# 非アクティブペインをグレーアウトする
set -g window-style fg=colour240,bg=#0a2228
set -g window-active-style fg=terminal,bg=terminal

# コマンドラインの色を設定する
set -g message-style fg=white,bg=colour234,bright

# ステータスバーを設定する
## 左パネルを設定する
# set -g status-left-length 40
# set -g status-left "#[fg=green]Session: #S #[fg=yellow]#I #[fg=cyan]#P"
set -g status-left-length 0
set -g status-left ""
## 右パネルを設定する
set -g status-right "#[fg=cyan][%Y-%m-%d(%a) %H:%M:%S]"
## リフレッシュの間隔を設定する(デフォルト 15秒)
set -g status-interval 1
## ウィンドウリストの位置を中心寄せにする
set -g status-justify left
## ヴィジュアルノーティフィケーションを有効にする
setw -g monitor-activity off
set -g visual-activity off
## ステータスバーを上部に表示する
set -g status-position top

